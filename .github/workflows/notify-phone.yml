name: Notify phone
on:
  push:
    branches: [main]
    paths: [status.json]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/notify.py
        env:
          NTFY_TOPIC: deskcrew-19a114079819169e
          BEFORE: ${{ github.event.before }}
